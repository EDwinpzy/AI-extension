<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图标方案 · 10 组</title>
<style>
  :root {
    --bg: #0b0f18;
    --card: #121a2b;
    --line: #22304a;
    --text: #e6eefc;
    --dim: #8b9bb4;
    --accent: #2dd4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 28px 56px;
    background: radial-gradient(1200px 600px at 15% -10%, #16233c 0%, var(--bg) 55%);
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header { max-width: 1180px; margin: 0 auto 26px; }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: .3px; }
  header p { margin: 0; color: var(--dim); }
  .grid {
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }
  .card {
    background: linear-gradient(180deg, #131c2f, #0e1523);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .num {
    font: 600 12px/1 ui-monospace, monospace;
    color: #06202b;
    background: var(--accent);
    border-radius: 6px;
    padding: 4px 7px;
  }
  .name { font-weight: 600; }
  .stage {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    padding: 16px;
    border-radius: 12px;
    background: #0a0f19;
    border: 1px solid #1b2740;
  }
  .sizes { display: flex; align-items: flex-end; gap: 14px; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .slot span { font: 10px ui-monospace, monospace; color: var(--dim); }
  .light {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-radius: 12px;
    background: #f2f5fa;
  }
  .light .slot span { color: #5b6b82; }
  .note { margin: 12px 0 0; color: var(--dim); font-size: 12.5px; }
  svg { display: block; }
</style>
</head>
<body>
<header>
  <h1>图标方案 · 10 组</h1>
  <p>每张卡片：128px 主图、48 / 32 / 16 实际尺寸，下方是浅色工具条上的对比。16px 那一格才是真正的考题。</p>
</header>
<div class="grid" id="grid"></div>

<script src="designs.js"></script>
<script>
  const grid = document.getElementById('grid');

  ICONS.forEach((icon, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="head">
        <span class="num">${String(index + 1).padStart(2, '0')}</span>
        <span class="name">${icon.name}</span>
      </div>
      <div class="stage">
        <div class="slot">${iconSvg(icon, 128)}<span>128</span></div>
        <div class="sizes">
          <div class="slot">${iconSvg(icon, 48)}<span>48</span></div>
          <div class="slot">${iconSvg(icon, 32)}<span>32</span></div>
          <div class="slot">${iconSvg(icon, 16)}<span>16</span></div>
        </div>
      </div>
      <div class="light">
        <div class="sizes">
          <div class="slot">${iconSvg(icon, 32)}<span>32</span></div>
          <div class="slot">${iconSvg(icon, 16)}<span>16</span></div>
        </div>
      </div>
      <p class="note">${icon.note}</p>
    `;
    grid.appendChild(card);
  });
</script>
</body>
</html>
