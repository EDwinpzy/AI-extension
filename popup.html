<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI-extension</title>
  <style>
    body { width: 220px; margin: 0; padding: 8px; font-family: system-ui, sans-serif; }
    .title { font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #eee; margin-bottom: 6px; }
    .menu { display: flex; flex-direction: column; gap: 4px; }
    .menu button {
      text-align: left; padding: 8px 10px; border: 0; background: transparent;
      border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .menu button:hover { background: #f2f2f2; }
  </style>
</head>
<body>
  <div class="title">AI-extension</div>
  <div class="menu">
    <button id="open-settings">打开设置页</button>
    <button id="clear-cache">清除翻译缓存</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
